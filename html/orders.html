<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Orders Dashboard | MARIDIAN '26 
</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="../css/orders.css">

</head>

<body>

    <!-- ==========================================
                    NAVBAR
    =========================================== -->

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">

        <div class="container">

            <a class="navbar-brand fw-bold"
                href="../index.html">

                🌍  MARIDIAN '26 


            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse justify-content-end"
                id="navbarMenu">

                <ul class="navbar-nav">

                    <li class="nav-item">

                        <a class="nav-link"
                            href="../index.html">

                            Home

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                            href="admin.html">

                            Registrations

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link active"
                            href="#">

                            Orders

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- ==========================================
                    HEADER
    =========================================== -->

    <section class="admin-header">

        <div class="container text-center">

            <span class="badge bg-warning text-dark px-4 py-2 mb-3">

                ADMIN PANEL

            </span>

            <h1>

                Orders Dashboard

            </h1>

            <p>

                View and manage merchandise orders.

            </p>

        </div>

    </section>

 

    <!-- ==========================================
                STATS
========================================== -->

<section class="container mb-5">

    <div class="row justify-content-center">

        <div class="col-lg-4 col-md-6">

            <div class="stat-card text-center">

                <i class="bi bi-bag-fill stat-icon"></i>

                <h3 id="totalOrders">

                    0

                </h3>

                <p>

                    Total Orders

                </p>

            </div>

        </div>

    </div>

</section>

    <!-- ==========================================
                SEARCH + EXPORT
    =========================================== -->

    <section class="container mb-4">

        <div class="row">

            <div class="col-lg-6">

                <input
                    type="text"
                    id="searchOrder"
                    class="form-control"
                    placeholder="Search Order Number, Customer or Email">

            </div>

            <div class="col-lg-6 text-end">

                <button
                    id="exportOrders"
                    class="btn btn-success">

                    <i class="bi bi-file-earmark-excel-fill"></i>

                    Export Excel

                </button>

            </div>

        </div>

    </section>

    <!-- ==========================================
                    TABLE
    =========================================== -->

    <section class="container mb-5">

        <div class="table-responsive">

            <table class="table table-dark table-hover text-center align-middle">

                <thead>

    <tr>

        <th># </th>
        <th>Order No</th>

        <th>Customer</th>

        <th>Total</th>

        <th>Receipt</th>

        <th>Actions</th>

    </tr>

</thead> 

                <tbody id="ordersTable">

                </tbody>

            </table>

        </div>

        <div
            id="noOrders"
            class="text-center mt-5 d-none">

            <i class="bi bi-bag-x display-1"></i>

            <h3>

                No Orders Found

            </h3>

        </div>

    </section>

    <!-- ==========================================
                DETAILS MODAL
    =========================================== -->

    <div
        class="modal fade"
        id="orderModal"
        tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header">

                    <h5>

                        Order Details

                    </h5>

                    <button
                        class="btn-close"
                        data-bs-dismiss="modal">

                    </button>

                </div>

                <div class="modal-body"
                    id="orderDetails">

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Excel -->

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <!-- Orders JS -->

    <script type="module"
        src="../js/orders.js"></script>

</body>

</html>
