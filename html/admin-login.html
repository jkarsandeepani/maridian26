
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Admin Login | Global Village 5.0
    </title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="../css/admin-login.css">

</head>

<body>

    <div class="login-wrapper">

        <div class="login-card">

            <!-- Logo -->

            <div class="text-center mb-4">

                <h1 class="logo">

                    🌍

                </h1>

                <h2>

                   MARIDIAN '26

                </h2>

                <p>

                    Organizing Committee Portal

                </p>

            </div>

            <!-- Login Form -->

            <form id="loginForm">

                <!-- Email -->

                <div class="mb-3">

                    <label class="form-label">

                        Email Address

                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter admin email"
                        required>

                </div>

                <!-- Password -->

                <div class="mb-4">

                    <label class="form-label">

                        Password

                    </label>

                    <div class="input-group">

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Enter password"
                            required>

                        <button
                            class="btn btn-outline-secondary"
                            type="button"
                            id="togglePassword">

                            <i class="bi bi-eye"></i>

                        </button>

                    </div>

                </div>
                                <!-- Error Message -->

                <div
                    id="loginError"
                    class="alert alert-danger d-none">

                    Invalid email or password.

                </div>

                <!-- Login Button -->

                <div class="d-grid">

                    <button
                        type="submit"
                        class="btn btn-primary btn-lg">

                        <i class="bi bi-box-arrow-in-right"></i>

                        Login

                    </button>

                </div>

            </form>

            <hr class="my-4">

            <!-- Information -->

            <div class="text-center">

                <small class="text-muted">

                    This dashboard is restricted to

                    <strong>

                      MARIDIAN '26 Organizing Committee

                    </strong>

                    members only.

                </small>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Login JS -->

    <script
        type="module"
        src="../js/admin-login.js">

    </script>

</body>

</html>
