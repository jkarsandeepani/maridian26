<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Checkout | Global Village 5.0</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Main CSS -->

    <link rel="stylesheet" href="../css/style.css">

    <!-- Checkout CSS -->

    <link rel="stylesheet" href="../css/checkout.css">

</head>

<body>

    <!-- HEADER -->

    <section class="checkout-header">

        <div class="container text-center">

            <h1>

                Checkout

            </h1>

            <p>

                Complete your order information

            </p>

        </div>

    </section>

    <!-- CHECKOUT -->

    <section class="container py-5">

        <div class="row g-4">

            <!-- CUSTOMER DETAILS -->

            <div class="col-lg-7">

                <div class="checkout-card">

                    <h3 class="mb-4">

                        <i class="bi bi-person-circle"></i>

                        Customer Details

                    </h3>

                    <form id="checkoutForm">

                        <div class="mb-3">

                            <label class="form-label">

                                Full Name

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="fullName"
                                required>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Email Address

                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Phone Number

                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    id="phone"
                                    required>

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Batch

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="batch">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Delivery / Collection Notes

                            </label>

                            <textarea
                                class="form-control"
                                id="notes"
                                rows="4"
                                placeholder="Optional"></textarea>

                        </div>

                    </form>

                </div>

            </div>

            <!-- ORDER SUMMARY -->

            <div class="col-lg-5">

                <div class="checkout-card">

                    <h3>

                        <i class="bi bi-cart-check-fill"></i>

                        Order Summary

                    </h3>

                    <hr>

                    <div id="orderSummary">

                        <!-- JS will load cart items -->

                    </div>

                    <hr>

                    <div class="d-flex justify-content-between">

                        <strong>

                            Total

                        </strong>

                        <strong id="orderTotal">

                            Rs.0

                        </strong>

                    </div>

                    <button
                        class="btn btn-warning w-100 mt-4"
                        id="continuePayment">

                        Continue to Payment

                        <i class="bi bi-arrow-right-circle ms-2"></i>

                    </button>

                </div>

            </div>

        </div>

    </section>

    <script type="module" src="../js/checkout.js"></script>

</body>

</html>
