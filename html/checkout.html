<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Checkout | MARIDIAN '26</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Checkout CSS -->
    <link rel="stylesheet" href="../css/checkout.css">

</head>

<body>


    <!-- ================================
         CHECKOUT HEADER
    ================================= -->

    <section class="checkout-header">

        <div class="container text-center">

            <h1>
                Checkout
            </h1>

            <p>
                Complete your order information
            </p>

        </div>

    </section>



    <!-- ================================
         CHECKOUT SECTION
    ================================= -->

    <section class="container py-5">

        <div class="row g-4">


            <!-- ================================
                 CUSTOMER DETAILS
            ================================= -->

            <div class="col-lg-7">

                <div class="checkout-card">

                    <h3 class="checkout-title">

                        <i class="bi bi-person-circle"></i>

                        Customer Details

                    </h3>


                    <form id="checkoutForm">


                        <!-- Full Name -->

                        <div class="mb-3">

                            <label
                                for="fullName"
                                class="form-label">

                                Full Name

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="fullName"
                                placeholder="Enter your full name"
                                required>

                        </div>



                        <!-- Email + Phone -->

                        <div class="row">


                            <div class="col-md-6 mb-3">

                                <label
                                    for="email"
                                    class="form-label">

                                    Email Address

                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    placeholder="example@email.com"
                                    required>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label
                                    for="phone"
                                    class="form-label">

                                    Phone Number

                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    id="phone"
                                    placeholder="07XXXXXXXX"
                                    required>

                            </div>

                        </div>



                        <!-- Batch -->

                        <div class="mb-3">

                            <label
                                for="batch"
                                class="form-label">

                                Batch

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="batch"
                                placeholder="Enter your batch">

                        </div>



                 



            <!-- ================================
                 ORDER SUMMARY
            ================================= -->

            <div class="col-lg-5">

                <div class="checkout-card summary-card">


                    <h3 class="checkout-title">

                        <i class="bi bi-cart-check-fill"></i>

                        Order Summary

                    </h3>


                    <hr>


                    <!-- Cart Items -->

                    <div id="orderSummary">

                        <!-- JavaScript loads cart items here -->

                    </div>


                    <hr>


                    <!-- Total -->

                    <div class="total-row">

                        <strong>
                            Total
                        </strong>

                        <strong id="orderTotal">
                            Rs. 0
                        </strong>

                    </div>


                    <!-- Continue -->

                    <button
                        type="button"
                        class="btn btn-warning w-100 mt-4"
                        id="continuePayment">

                        Continue to Payment

                        <i class="bi bi-arrow-right-circle ms-2"></i>

                    </button>


                    <!-- Back to Cart -->

                    <a
                        href="cart.html"
                        class="back-cart">

                        <i class="bi bi-arrow-left"></i>

                        Back to Cart

                    </a>


                </div>

            </div>


        </div>

    </section>



    <!-- Checkout JS -->

    <script
        type="module"
        src="../js/checkout.js">
    </script>

</body>

</html>
